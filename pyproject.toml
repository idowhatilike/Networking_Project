[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ogk-parental-companion"
version = "0.1.0"
description = "Ứng dụng hỗ trợ quản lý việc sử dụng máy tính của trẻ em - Công cụ đồng hành minh bạch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "psutil>=5.9.8",
    "pywin32>=306; sys_platform == 'win32'",
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "dnslib>=0.9.24",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "server*", "shared*"]
exclude = ["data*", "tests*", ".venv*"]